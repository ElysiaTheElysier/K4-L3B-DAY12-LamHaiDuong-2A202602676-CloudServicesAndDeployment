name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Checkpoints (CP1 - CP4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and integration tests
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: |
          pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: |
          docker build -t day12-agent:ci .

  deploy:
    name: Deploy to Railway Production
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            npm install -g @railway/cli
            railway up --service ai-agent --detach
          else
            echo "RAILWAY_TOKEN secret not configured; skipping CLI redeploy and running smoke test against production URL."
          fi

      - name: Smoke test production endpoint
        run: |
          PUBLIC_URL="${{ vars.PUBLIC_URL || 'https://ai-agent-production-f1a4.up.railway.app' }}"
          curl -fsS "$PUBLIC_URL/health"
          curl -fsS "$PUBLIC_URL/ready"
